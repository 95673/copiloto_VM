<style>
/* Aspeto do Copiloto. As cores estão no topo (:root), muda só aí. */
:root{--bg:#F6F8F7;--ink:#0B2E33;--mut:#4A6468;--teal:#0F7C80;--acc:#E9A800;--line:#CFDAD8;--alerta:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0A1F22;--ink:#EAF3F1;--mut:#A3B9B8;--teal:#3DB7B2;--acc:#F2B01E;--line:#23454A;--alerta:#FF9C94}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.55 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:68rem;margin:0 auto;padding:1rem 1rem 3rem}
header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.9rem}
h1{font:800 1.3rem "Bricolage Grotesque",Figtree,sans-serif;margin:0}
header span{color:var(--mut);font-size:.9rem}
#q{width:100%;font:600 1.25rem Figtree,system-ui,sans-serif;color:var(--ink);background:transparent;border:3px solid var(--ink);border-radius:.6rem;padding:.9rem 1rem}
#q:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.9rem 0 .2rem}
.chips button{font:600 .95rem Figtree,system-ui,sans-serif;color:var(--ink);background:var(--line);border:0;border-radius:2rem;padding:.5rem .9rem;cursor:pointer}
.chips.temas button{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.rotulo{margin:1rem 0 .1rem;color:var(--mut);font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#estado{margin:1rem 0 .5rem;color:var(--mut);font-size:.9rem;min-height:1.3em}
.res{border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:.5rem;padding:.9rem 1rem;margin-bottom:.8rem}
.res:first-child{border-left-color:var(--acc)}
.res small{color:var(--teal);font-weight:600}
.res h3{margin:.1rem 0 .4rem;font:600 1rem Figtree,sans-serif;color:var(--mut)}
.res p{margin:0 0 .7rem;font-size:1.2rem;line-height:1.5}
code{font:600 1em ui-monospace,Menlo,Consolas,monospace;background:var(--line);border-radius:.3rem;padding:.05em .35em;white-space:nowrap}
.res button{font:600 .95rem Figtree,system-ui,sans-serif;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:.4rem;padding:.45rem .9rem;cursor:pointer}
.vazio{border:2px dashed var(--line);border-radius:.5rem;padding:1.1rem;font-size:1.15rem}
footer{color:var(--mut);font-size:.85rem;margin-top:1.5rem}
.layout{display:block}
.dica{display:none;color:var(--mut);font-size:.85rem;margin:.6rem 0 0}
.res.sel{box-shadow:0 0 0 3px var(--acc)}
@media (max-width:55.99rem){body.com-res #atalhos{display:none}}
@media (min-width:56rem){
  .wrap{padding:1.5rem 2rem 3rem}
  #q{font-size:1.5rem;padding:1.1rem 1.3rem}
  .layout{display:grid;grid-template-columns:17rem 1fr;gap:2rem;align-items:start;margin-top:.5rem}
  #atalhos{position:sticky;top:1rem}
  #estado{margin-top:.2rem}
}
@media (hover:hover) and (pointer:fine){.dica{display:block}}
.velha{display:block;margin:-.2rem 0 .7rem;color:var(--alerta);font-size:.9rem;font-weight:600;font-style:normal}
</style>
</head>

-02", "tema": "Prémios", "pergunta": "Como participar no Jackpot e no Soprati?", "resposta": "Para o Jackpot marque *111# e siga as instruções. Para o Soprati marque *109# e siga as instruções.", "parecidas": ["jackpot", "soprati", "sorteios"], "fonte": "Dino (FAQs Vodacom corrigidas)", "atualizado_em": "2026-11-08"}, {"id": "agente-01", "tema": "Agente M-Pesa", "pergunta": "O que é preciso para ser Agente M-Pesa?", "resposta": "É preciso ter um estabelecimento (móvel ou imóvel), capacidade de investimento de no mínimo 10.000 MT, documento de identificação (BI, passaporte ou carta de condução), licença comercial ou alvará válido por 30 dias ou mais, NUIT, registo criminal (idoneidade), telemóvel para gerir a atividade e o formulário de adesão preenchido.", "parecidas": ["ser agente mpesa", "abrir banca mpesa", "como virar agente"], "fonte": "Dino (FAQs Vodacom corrigidas)", "atualizado_em": "2026-11-08"}]};
/* Motor de procura do Copiloto. Normalmente não precisas de mexer aqui:
   as palavras ignoradas e os sinónimos estão em faqs.json, dentro de "config". */
function criarMotor(config) {
  const PARAR = new Set(config.palavras_ignoradas);
  const SIN = config.sinonimos;
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/m[\s-]?pesa/g, "mpesa").replace(/[^a-z0-9]+/g, " ").trim();
  const toks = s => norm(s).split(" ").filter(t => t && !PARAR.has(t)).map(t => SIN[t] || t);
  function dist(a, b) {
    const m = [];
    for (let i = 0; i <= a.length; i++) m[i] = [i];
    for (let j = 1; j <= b.length; j++) m[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return m[a.length][b.length];
  }
  function casa(q, d) {
    if (q === d) return 1;                                   // palavra igual
    if (q.length >= 3 && d.startsWith(q)) return 0.8;        // a meio de escrever
    if (q.length >= 4 && d.length >= 4 && dist(q, d) <= (q.length >= 6 ? 2 : 1)) return 0.6; // gralha
    return 0;
  }
  // pesos: pergunta 3, perguntas parecidas 3, tema 1, resposta 0.6
  const indexar = faqs => faqs.map(f => ({ f, campos: [[toks(f.pergunta), 3], [toks(f.parecidas.join(" ")), 3], [toks(f.tema), 1], [toks(f.resposta), 0.6]] }));
  function procurar(indice, texto, max = 4) {
    const q = toks(texto);
    if (!q.length) return [];
    const res = [];
    for (const { f, campos } of indice) {
      let soma = 0, achou = 0;
      for (const t of q) {
        let melhor = 0, segundo = 0;
        for (const [lista, peso] of campos) for (const d of lista) {
          const c = casa(t, d) * (peso === 0.6 && /^\d+$/.test(t) ? 3 : peso);   // códigos numéricos pesam mais na resposta
          if (c > melhor) { segundo = melhor; melhor = c; } else if (c > segundo) segundo = c;
        }
        if (melhor > 0) { soma += melhor + 0.3 * segundo; achou++; }
      }
      if (!achou) continue;
      if (q.length > 1 && achou < q.length) soma *= 0.4;     // faltou alguma palavra
      if (soma >= 1.2) res.push({ f, soma: soma - 0.01 * campos[0][0].length });
    }
    res.sort((a, b) => b.soma - a.soma);
    return res.filter(r => r.soma >= res[0].soma * 0.5).slice(0, max).map(r => r.f);
  }
  return { indexar, procurar, norm, toks };
}
if (typeof module !== "undefined") module.exports = { criarMotor };

/* Interface do Copiloto. Para mudar respostas, atalhos ou sinónimos edita só o faqs.json. */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const destacar = t => esc(t).replace(/\*\d[^\s]*?#/g, "<code>$&</code>");   // códigos USSD em destaque
let DADOS, CFG, motor, indice, sel = 0;

function selecionar(i) {   // realça um cartão (setas do teclado)
  const c = document.querySelectorAll("#res .res");
  if (!c.length) return;
  sel = Math.max(0, Math.min(c.length - 1, i));
  c.forEach((el, n) => el.classList.toggle("sel", n === sel));
  c[sel].scrollIntoView({ block: "nearest" });
}

const dias = d => Math.floor((Date.now() - new Date(d + "T00:00:00")) / 864e5);
const velha = f => dias(f.atualizado_em) > CFG.validade_dias;

function cartao(f) {
  return '<article class="res"><small>' + esc(f.tema) + "</small><h3>" + esc(f.pergunta) + "</h3><p>" + destacar(f.resposta) + "</p>" +
    (velha(f) ? '<em class="velha">Confirmar antes de usar: verificada há ' + dias(f.atualizado_em) + " dias</em>" : "") +
    '<button type="button" data-id="' + esc(f.id) + '">Copiar resposta</button></article>';
}
function mostrar(lista, ms) {
  document.body.classList.add("com-res");
  if (!lista.length) { $("estado").textContent = ""; $("res").innerHTML = '<div class="vazio">' + esc(DADOS.regra_sem_resposta) + "</div>"; return; }
  $("estado").textContent = lista.length + (lista.length === 1 ? " resposta em " : " respostas em ") + Math.max(1, Math.round(ms)) + " ms";
  $("res").innerHTML = lista.map(cartao).join("");
  selecionar(0);
}
function pesquisar(texto) {
  if (!texto.trim()) { document.body.classList.remove("com-res"); $("estado").textContent = ""; $("res").innerHTML = ""; return; }
  const t0 = performance.now();
  const r = motor.procurar(indice, texto);
  mostrar(r, performance.now() - t0);
}
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); }
  catch (e) { const a = document.createElement("textarea"); a.value = texto; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e2) {} a.remove(); }
}
async function iniciar() {
  try {
    if (window.FAQS_EMBUTIDAS) DADOS = window.FAQS_EMBUTIDAS;   // versão de uma só página (demonstração)
    else {
      const r = await fetch("faqs.json", { cache: "no-cache" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      DADOS = await r.json();
    }
  } catch (e) {
    $("estado").textContent = "Não consegui ler o faqs.json (falta o ficheiro ou tem um erro de escrita, por exemplo uma vírgula em falta).";
    return;
  }
  CFG = DADOS.config; motor = criarMotor(CFG); indice = motor.indexar(DADOS.faqs);
  $("contagem").textContent = DADOS.faqs.length + " respostas";
  $("mais").innerHTML = CFG.atalhos.map(a => '<button type="button">' + esc(a) + "</button>").join("");
  const temas = [...new Set(DADOS.faqs.map(f => f.tema))];
  $("temas").innerHTML = temas.map(t => '<button type="button" data-tema="' + esc(t) + '">' + esc(t) + "</button>").join("");
  $("q").addEventListener("input", e => pesquisar(e.target.value));
  $("atalhos").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tema) { $("q").value = ""; mostrar(DADOS.faqs.filter(f => f.tema === b.dataset.tema), 1); }
    else { $("q").value = b.textContent; pesquisar(b.textContent); }
  });
  $("res").addEventListener("click", async e => {
    const b = e.target.closest("button[data-id]"); if (!b) return;
    await copiar(DADOS.faqs.find(x => x.id === b.dataset.id).resposta);
    b.textContent = "Copiado ✓"; setTimeout(() => { b.textContent = "Copiar resposta"; }, 1500);
  });
  if (matchMedia("(hover: hover) and (pointer: fine)").matches) $("q").focus();   // computador: pronto a escrever
}

/* Teclado (computador): / pesquisar, setas escolher, Enter copiar, Esc limpar */
document.addEventListener("keydown", e => {
  const campo = document.activeElement === $("q");
  if (e.key === "/" && !campo && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); return; }
  if (e.key === "Escape" && DADOS) { $("q").value = ""; pesquisar(""); $("q").focus(); return; }
  const cartoes = document.querySelectorAll("#res .res");
  if (!cartoes.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); selecionar(sel + (e.key === "ArrowDown" ? 1 : -1)); }
  else if (e.key === "Enter" && campo) { e.preventDefault(); cartoes[sel].querySelector("button").click(); }
});
iniciar();
</script>
</body>
